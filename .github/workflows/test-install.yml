name: Test HiWonder Installer

on:
  push:
    branches: [master, hiwonder-ros2-opencv]
  pull_request:
    branches: [master]

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run HiWonder unit tests
        run: python -m unittest discover -s tests -p 'test_hiwonder_installer.py' -v

      - name: Check Python syntax
        run: python -m py_compile install.py

      - name: Check bootstrap syntax
        run: bash -n install

      - name: Check non-interactive plan
        run: python install.py all --plan
